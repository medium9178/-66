<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>合成表情包 · 无限循环版</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#1d1637,#342255 55%,#161c3e);color:#fff;font-family:system-ui,'Microsoft YaHei',sans-serif;display:flex;justify-content:center;min-height:100vh}.app{width:min(100%,530px);padding:14px 12px 20px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:24px;margin:4px 0 8px}.score{background:#ffffff19;border:1px solid #ffffff35;border-radius:13px;padding:8px 14px;text-align:center;font-size:13px}.score strong{display:block;font-size:23px}.info{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:9px 0}.next{display:flex;align-items:center;gap:9px;font-size:13px}.next img{width:42px;height:42px;object-fit:contain;background:#ffffff1b;border-radius:50%}button{background:#f6cb5a;color:#2d2250;border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}canvas{display:block;width:100%;background:linear-gradient(#e9dbff,#d9b8ed);border:5px solid #f2d6ff;border-radius:20px;touch-action:none;box-shadow:0 12px 45px #08041d99}.hint{color:#d5c9e6;text-align:center;font-size:12px;line-height:1.8}.levels{display:flex;gap:5px;overflow-x:auto;padding:9px 0}.levels img{width:35px;height:35px;object-fit:contain;flex:none;background:#ffffff24;border-radius:50%}</style></head><body><div class="app"><header><h1>🎮 合成表情包</h1><div class="score">得分<strong id="score">0</strong></div></header><div class="info"><div class="next">下一个 <img id="next" src="images/01.png"> <span id="status">点击或触摸投放</span></div><button id="restart">重新开始</button></div><canvas id="game" width="440" height="610"></canvas><div class="levels" id="levels"></div><p class="hint">相同等级合成下一级 · 两个第11级合成第1级 · 无限循环<br>电脑移动鼠标定位，点击投放；手机拖动定位，松手投放。</p></div><script>
const cv=document.querySelector('#game'),ctx=cv.getContext('2d'),W=440,H=610;const scoreEl=document.querySelector('#score'),nextEl=document.querySelector('#next'),statusEl=document.querySelector('#status');const imgs=Array.from({length:11},(_,i)=>{const im=new Image();im.src=`images/${String(i+1).padStart(2,'0')}.png`;return im});document.querySelector('#levels').innerHTML=imgs.map((_,i)=>`<img title="第${i+1}级" src="images/${String(i+1).padStart(2,'0')}.png">`).join('');let balls=[],score=0,aim=220,next=0,over=false,last=0,cool=0;const radii=[19,25,31,38,46,54,63,73,83,94,105];function rand(){return Math.floor(Math.random()*Math.min(5,3+Math.floor(score/350)))}function reset(){balls=[];score=0;next=rand();over=false;cool=0;scoreEl.textContent=score;statusEl.textContent='点击或触摸投放';nextEl.src=imgs[next].src}function drop(){if(over||cool>0)return;let r=radii[next];balls.push({x:Math.max(r+5,Math.min(W-r-5,aim)),y:45,r,level:next,vx:0,vy:0,age:0});next=rand();nextEl.src=imgs[next].src;cool=.48}function pointer(e){const b=cv.getBoundingClientRect();aim=Math.max(22,Math.min(418,(e.clientX-b.left)*W/b.width))}cv.addEventListener('pointermove',pointer);cv.addEventListener('pointerdown',e=>{pointer(e);if(e.pointerType==='mouse')drop()});cv.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse'){pointer(e);drop()}});document.querySelector('#restart').onclick=reset;
function step(dt){if(over)return;cool=Math.max(0,cool-dt);let n=Math.min(4,Math.ceil(dt/.009)),h=dt/n;for(let k=0;k<n;k++){for(const b of balls){b.age+=h;b.vy+=750*h;b.x+=b.vx*h;b.y+=b.vy*h;b.vx*=.994;b.vy*=.997;if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.35}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.35}if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)*.13;b.vx*=.93}}for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j];let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01,limit=a.r+b.r;if(d>=limit)continue;let nx=dx/d,ny=dy/d;if(a.level===b.level){const level=(a.level+1)%11,x=(a.x+b.x)/2,y=(a.y+b.y)/2;balls.splice(j,1);balls.splice(i,1);balls.push({x,y,r:radii[level],level,vx:(a.vx+b.vx)*.2,vy:-85,age:0});score+=(a.level+2)*10;scoreEl.textContent=score;i=-1;break}let overlap=(limit-d)*.52;a.x-=nx*overlap;a.y-=ny*overlap;b.x+=nx*overlap;b.y+=ny*overlap;let rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){let imp=rel*.44;a.vx+=imp*nx;a.vy+=imp*ny;b.vx-=imp*nx;b.vy-=imp*ny}}}if(balls.some(b=>b.y-b.r<66&&b.age>2.5&&Math.abs(b.vy)<45)){over=true;statusEl.textContent='游戏结束，点击重新开始'}}
function render(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff5';ctx.fillRect(0,75,W,2);ctx.setLineDash([5,8]);ctx.strokeStyle='#9272ad88';ctx.beginPath();ctx.moveTo(aim,0);ctx.lineTo(aim,75);ctx.stroke();ctx.setLineDash([]);for(const b of balls){ctx.save();ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle=['#ffe6f1','#fff1ce','#d9f5ec','#e6e4ff'][b.level%4];ctx.shadowColor='#4b256777';ctx.shadowBlur=8;ctx.fill();ctx.clip();if(imgs[b.level].complete&&imgs[b.level].naturalWidth)ctx.drawImage(imgs[b.level],b.x-b.r,b.y-b.r,b.r*2,b.r*2);ctx.restore();ctx.strokeStyle='#ffffffc0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke()}if(!over){let r=radii[next];ctx.globalAlpha=.65;ctx.beginPath();ctx.arc(aim,40,r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();if(imgs[next].complete&&imgs[next].naturalWidth)ctx.drawImage(imgs[next],aim-r,40-r,2*r,2*r);ctx.globalAlpha=1}else{ctx.fillStyle='#1b1435c9';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 38px sans-serif';ctx.fillText('游戏结束',W/2,H/2);ctx.font='20px sans-serif';ctx.fillText('得分：'+score,W/2,H/2+42)}}function loop(t){let dt=last?Math.min(.035,(t-last)/1000):.016;last=t;step(dt);render();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
</script></body></html>
